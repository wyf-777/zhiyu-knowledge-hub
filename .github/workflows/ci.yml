name: cross-platform-ci

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: zhiyu-windows-x64
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14
            artifact_name: zhiyu-macos
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/knowledge-api/requirements-dev.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Knowledge API dependencies
        run: python -m pip install -r services/knowledge-api/requirements-dev.txt pyinstaller

      - name: Verify frontend
        run: npm run build

      - name: Test Knowledge API
        run: npm run api:test

      - name: Enforce retrieval quality baseline
        run: npm run api:eval:gate

      - name: Build platform Sidecar
        run: npm run sidecar:build

      - name: Smoke test platform Sidecar
        run: npm run sidecar:smoke

      - name: Build Tauri desktop bundles
        run: npm run desktop:bundle

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
